<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3D Flocking Simulation with Food & Scare</title>
    <style>
      /* Make the canvas fill the screen */
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #111;
      }
    </style>
  </head>
  <body>
    <!-- Three.js will create a canvas for us -->
    <!-- Load Three.js from CDN -->
    <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
    <!-- Add sliders for flocking parameters -->
    <div style="position: absolute; top: 10px; left: 10px; color: white;">
      <label>Max Speed: <input type="range" id="maxSpeed" min="0.1" max="5" step="0.1" value="1.5"></label><br>
      <label>Max Force: <input type="range" id="maxForce" min="0.01" max="0.1" step="0.01" value="0.03"></label><br>
      <label>Neighbor Distance: <input type="range" id="neighborDist" min="10" max="50" step="1" value="20"></label><br>
      <label>Desired Separation: <input type="range" id="desiredSeparation" min="1" max="20" step="1" value="5"></label><br>
      <label>Scare Factor: <input type="range" id="scareFactor" min="0.01" max="1" step="0.01" value="0.3"></label><br>
      <label>Min Altitude: <input type="range" id="minAltitude" min="1" max="50" step="1" value="10"></label><br>
      <label>Detection Range: <input type="range" id="detectionRange" min="10" max="200" step="10" value="100"></label>
    </div>
    <script>
      // --- SETUP SCENE, CAMERA, & RENDERER ---
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111111);
      
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 50, 100);
      
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
      
      // Resize renderer on window resize
      window.addEventListener("resize", () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      });
      
      // --- ADD LIGHTING ---
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);
      
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(50, 100, 50);
      scene.add(directionalLight);
      
      // --- ADD A FOOD OBJECT ON THE GROUND ---
      const foodGeometry = new THREE.SphereGeometry(3, 16, 16);
      const foodMaterial = new THREE.MeshLambertMaterial({ color: 0xffaa00 });
      const food = new THREE.Mesh(foodGeometry, foodMaterial);
      // Place food at a random ground position
      food.position.set((Math.random()-0.5)*200, 3, (Math.random()-0.5)*200);
      scene.add(food);
      
      // --- GLOBAL PARAMETERS ---
      let MAX_SPEED = 1.5;
      let MAX_FORCE = 0.03;
      let NEIGHBOR_DIST = 20;
      let DESIRED_SEPARATION = 5;
      let SCARE_FACTOR = 0.3;
      let MIN_ALTITUDE = 10;
      let DETECTION_RANGE = 100;
      const NUM_BOIDS = 50;
      const boids = [];
      let scareActive = false; // when true, boids add a strong upward force
      
      // Flocking parameters
      // --- BOID CLASS ---
      class Boid {
        constructor() {
          // Position, velocity, acceleration as THREE.Vector3
          this.position = new THREE.Vector3(
            (Math.random()-0.5)*100,
            10 + Math.random()*30,
            (Math.random()-0.5)*100
          );
          this.velocity = new THREE.Vector3(
            (Math.random()-0.5)*2,
            (Math.random()-0.5)*2,
            (Math.random()-0.5)*2
          );
          this.acceleration = new THREE.Vector3();
          this.state = "Flying"; // "Flying", "Descending", or "Eating"
          
          // Create a simple geometry to represent the boid (a cone pointing forward)
          const geom = new THREE.ConeGeometry(1, 4, 8);
          this.material = new THREE.MeshLambertMaterial({ color: 0x00ffcc });
          this.mesh = new THREE.Mesh(geom, this.material);
          scene.add(this.mesh);
        }
        
        // Main update method
        update(boids, context) {
          if (this.state === "Flying") {
            this.flyingBehavior(boids, context);
          } else if (this.state === "Descending") {
            this.descendingBehavior(context);
          } else if (this.state === "Eating") {
            this.eatingBehavior(boids, context);
          }
          
          // Update mesh position
          this.mesh.position.copy(this.position);
          
          // Orient the mesh along the velocity vector.
          const axis = new THREE.Vector3(0, 1, 0);
          this.mesh.quaternion.setFromUnitVectors(axis, this.velocity.clone().normalize());
        }
        
        // Flying behavior
        flyingBehavior(boids, context) {
          // Flocking behaviors
          const sep = this.separate(boids).multiplyScalar(1.5);
          const ali = this.align(boids);
          const coh = this.cohesion(boids);
          
          // Food attraction: if not feeding, and if food is below and not too far, move toward food
          let foodAttraction = new THREE.Vector3();
          const foodPos = context.foodPos;
          const distToFood = this.position.distanceTo(foodPos);
          // apply a downward attraction toward the food (reduce altitude)
          foodAttraction = foodPos.clone().sub(this.position);
          foodAttraction.normalize();
          foodAttraction.multiplyScalar(0.05);
          
          // Scare behavior: when active, add strong upward force
          let scareForce = new THREE.Vector3();
          if (scareActive) {
            scareForce.set(0, 1, 0);
            scareForce.multiplyScalar(SCARE_FACTOR);
          }
          
          // Maintain minimum altitude
          let altitudeForce = new THREE.Vector3();
          if (this.position.y < MIN_ALTITUDE) {
            altitudeForce.set(0, 1, 0);
            altitudeForce.multiplyScalar(0.1);
          }
          
          // Sum up all forces
          this.acceleration.add(sep);
          this.acceleration.add(ali);
          this.acceleration.add(coh);
          this.acceleration.add(foodAttraction);
          this.acceleration.add(scareForce);
          this.acceleration.add(altitudeForce);
          
          // Update velocity and position
          this.velocity.add(this.acceleration);
          // Limit speed
          this.velocity.clampLength(0, MAX_SPEED);
          this.position.add(this.velocity);
          
          // Reset acceleration for next frame.
          this.acceleration.set(0, 0, 0);
          
          // Bounce from boundaries (keep within a 250x250x250 cube)
          const BOUND = 250;
          if (this.position.x < -BOUND || this.position.x > BOUND)
            this.velocity.x *= -1;
          if (this.position.y < 1) {
            this.position.y = 1;
            this.velocity.y *= -1;
          }
          if (this.position.y > BOUND)
            this.velocity.y *= -1;
          if (this.position.z < -BOUND || this.position.z > BOUND)
            this.velocity.z *= -1;
          
          // Random chance to switch to "Descending" state if close to food
          if (distToFood < DETECTION_RANGE && Math.random() < 0.05) { // Increase chance and range
            this.state = "Descending";
            this.material.color.set(0xffa500); // Change color to amber when descending
          } else if (distToFood < DETECTION_RANGE) {
            this.material.color.set(0xffa500); // Change color to amber when near food
          } else {
            this.material.color.set(0x00ffcc); // Default color
          }
        }
        
        // Descending behavior
        descendingBehavior(context) {
          const foodPos = context.foodPos;
          const targetPos = foodPos.clone();
          targetPos.y = 3; // Target position on the ground
          
          const desired = targetPos.clone().sub(this.position);
          desired.normalize();
          desired.multiplyScalar(MAX_SPEED);
          const steer = desired.sub(this.velocity);
          steer.clampLength(0, MAX_FORCE);
          
          this.acceleration.add(steer);
          this.velocity.add(this.acceleration);
          this.velocity.clampLength(0, MAX_SPEED);
          this.position.add(this.velocity);
          this.acceleration.set(0, 0, 0);
          
          // Switch to "Eating" state when close to the ground
          if (this.position.distanceTo(targetPos) < 1) {
            this.state = "Eating";
            this.eatingStartTime = Date.now();
            this.material.color.set(0xff0000); // Change color to red when eating
          }
        }
        
        // Eating behavior
        eatingBehavior(boids, context) {
          // Stay near the food for a while
          const foodPos = context.foodPos;
          this.position.y = 3; // Stay on the ground
          this.velocity.set(0, 0, 0); // Stop moving
          
          // Maintain separation while eating
          const sep = this.separate(boids).multiplyScalar(1.5);
          this.acceleration.add(sep);
          this.velocity.add(this.acceleration);
          this.position.add(this.velocity);
          this.acceleration.set(0, 0, 0);
          
          // Switch back to "Flying" state after a few seconds
          if (Date.now() - this.eatingStartTime > 3000) {
            this.state = "Flying";
            this.material.color.set(0x00ffcc); // Change color back to default
          }
        }
        
        // Separation: steer to avoid crowding local flockmates
        separate(boids) {
          const steer = new THREE.Vector3();
          let count = 0;
          for (let other of boids) {
            const d = this.position.distanceTo(other.position);
            if (d > 0 && d < DESIRED_SEPARATION) {
              let diff = this.position.clone().sub(other.position);
              diff.normalize();
              diff.divideScalar(d); // Weight by distance
              steer.add(diff);
              count++;
            }
          }
          if (count > 0) {
            steer.divideScalar(count);
          }
          if (steer.length() > 0) {
            steer.normalize();
            steer.multiplyScalar(MAX_SPEED);
            steer.sub(this.velocity);
            steer.clampLength(0, MAX_FORCE);
          }
          return steer;
        }
        
        // Alignment: steer toward the average heading of local flockmates
        align(boids) {
          const sum = new THREE.Vector3();
          let count = 0;
          for (let other of boids) {
            const d = this.position.distanceTo(other.position);
            if (d > 0 && d < NEIGHBOR_DIST) {
              sum.add(other.velocity);
              count++;
            }
          }
          if (count > 0) {
            sum.divideScalar(count);
            sum.normalize();
            sum.multiplyScalar(MAX_SPEED);
            const steer = sum.sub(this.velocity);
            steer.clampLength(0, MAX_FORCE);
            return steer;
          }
          return new THREE.Vector3();
        }
        
        // Cohesion: steer to move toward the average position of local flockmates
        cohesion(boids) {
          const sum = new THREE.Vector3();
          let count = 0;
          for (let other of boids) {
            const d = this.position.distanceTo(other.position);
            if (d > 0 && d < NEIGHBOR_DIST) {
              sum.add(other.position);
              count++;
            }
          }
          if (count > 0) {
            sum.divideScalar(count);
            return this.seek(sum);
          }
          return new THREE.Vector3();
        }
        
        // A method that calculates a steering force toward a target
        seek(target) {
          const desired = target.clone().sub(this.position);
          desired.normalize();
          desired.multiplyScalar(MAX_SPEED);
          const steer = desired.sub(this.velocity);
          steer.clampLength(0, MAX_FORCE);
          return steer;
        }
      }
      
      // --- CREATE THE FLOCK ---
      for (let i = 0; i < NUM_BOIDS; i++) {
        boids.push(new Boid());
      }

      // Ground class
      class Ground {
        constructor(scene) {
          const groundGeo = new THREE.PlaneGeometry(500, 500);
          const groundMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
          this.mesh = new THREE.Mesh(groundGeo, groundMat);
          this.mesh.rotation.x = -Math.PI / 2;
          this.mesh.position.y = 0;
          scene.add(this.mesh);
        }

        getNormal() {
          return new THREE.Vector3(0, 1, 0);
        }
      }

      // Create ground instance
      const ground = new Ground(scene);

      // Function to create a new food object
      function createFood(position) {
        const newFood = new THREE.Mesh(foodGeometry, foodMaterial);
        newFood.position.copy(position);
        scene.add(newFood);
      }

      // On mouse click, trigger scare for a few seconds and add new food
      window.addEventListener("click", (event) => {
        scareActive = true;
        setTimeout(() => {
          scareActive = false;
        }, 3000);

        // Calculate mouse position in normalized device coordinates (-1 to +1)
        const mouse = new THREE.Vector2(
          (event.clientX / window.innerWidth) * 2 - 1,
          -(event.clientY / window.innerHeight) * 2 + 1
        );

        // Use Raycaster to find intersection point on the plane
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(ground.mesh);

        if (intersects.length > 0) {
          const intersectPoint = intersects[0].point;
          const normal = ground.getNormal();
          intersectPoint.add(normal.multiplyScalar(3)); // Place food above the ground
          food.position.copy(intersectPoint);
        }
      });

      // Update flocking parameters from sliders
      const maxSpeedSlider = document.getElementById('maxSpeed');
      const maxForceSlider = document.getElementById('maxForce');
      const neighborDistSlider = document.getElementById('neighborDist');
      const desiredSeparationSlider = document.getElementById('desiredSeparation');
      const scareFactorSlider = document.getElementById('scareFactor');
      const minAltitudeSlider = document.getElementById('minAltitude');
      const detectionRangeSlider = document.getElementById('detectionRange');

      // Function to save slider values to localStorage
      function saveSliderValues() {
        localStorage.setItem('maxSpeed', maxSpeedSlider.value);
        localStorage.setItem('maxForce', maxForceSlider.value);
        localStorage.setItem('neighborDist', neighborDistSlider.value);
        localStorage.setItem('desiredSeparation', desiredSeparationSlider.value);
        localStorage.setItem('scareFactor', scareFactorSlider.value);
        localStorage.setItem('minAltitude', minAltitudeSlider.value);
        localStorage.setItem('detectionRange', detectionRangeSlider.value);
      }

      // Function to load slider values from localStorage
      function loadSliderValues() {
        if (localStorage.getItem('maxSpeed')) {
          maxSpeedSlider.value = localStorage.getItem('maxSpeed');
          MAX_SPEED = parseFloat(maxSpeedSlider.value);
        }
        if (localStorage.getItem('maxForce')) {
          maxForceSlider.value = localStorage.getItem('maxForce');
          MAX_FORCE = parseFloat(maxForceSlider.value);
        }
        if (localStorage.getItem('neighborDist')) {
          neighborDistSlider.value = localStorage.getItem('neighborDist');
          NEIGHBOR_DIST = parseFloat(neighborDistSlider.value);
        }
        if (localStorage.getItem('desiredSeparation')) {
          desiredSeparationSlider.value = localStorage.getItem('desiredSeparation');
          DESIRED_SEPARATION = parseFloat(desiredSeparationSlider.value);
        }
        if (localStorage.getItem('scareFactor')) {
          scareFactorSlider.value = localStorage.getItem('scareFactor');
          SCARE_FACTOR = parseFloat(scareFactorSlider.value);
        }
        if (localStorage.getItem('minAltitude')) {
          minAltitudeSlider.value = localStorage.getItem('minAltitude');
          MIN_ALTITUDE = parseFloat(minAltitudeSlider.value);
        }
        if (localStorage.getItem('detectionRange')) {
          detectionRangeSlider.value = localStorage.getItem('detectionRange');
          DETECTION_RANGE = parseFloat(detectionRangeSlider.value);
        }
      }

      // Load slider values from localStorage on page load
      loadSliderValues();

      maxSpeedSlider.addEventListener('input', () => {
        MAX_SPEED = parseFloat(maxSpeedSlider.value);
        saveSliderValues();
      });
      maxForceSlider.addEventListener('input', () => {
        MAX_FORCE = parseFloat(maxForceSlider.value);
        saveSliderValues();
      });
      neighborDistSlider.addEventListener('input', () => {
        NEIGHBOR_DIST = parseFloat(neighborDistSlider.value);
        saveSliderValues();
      });
      desiredSeparationSlider.addEventListener('input', () => {
        DESIRED_SEPARATION = parseFloat(desiredSeparationSlider.value);
        saveSliderValues();
      });
      scareFactorSlider.addEventListener('input', () => {
        SCARE_FACTOR = parseFloat(scareFactorSlider.value);
        saveSliderValues();
      });
      minAltitudeSlider.addEventListener('input', () => {
        MIN_ALTITUDE = parseFloat(minAltitudeSlider.value);
        saveSliderValues();
      });
      detectionRangeSlider.addEventListener('input', () => {
        DETECTION_RANGE = parseFloat(detectionRangeSlider.value);
        saveSliderValues();
      });

      // --- ANIMATION LOOP ---
      function animate() {
        requestAnimationFrame(animate);
        let context = { foodPos: food.position };
        // Update each boid
        boids.forEach(boid => boid.update(boids, context));
        scareActive = false;
        renderer.render(scene, camera);
      }
      
      animate();
    </script>
  </body>
</html>
